<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Petualangan Bahasa Arab — Negeri 1001 Malam 🌙</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#2A2260; --dusk:#5B3B8C; --sunset:#C4508B; --gold:#F5C542; --gold2:#D99A1B;
    --sand:#F0C878; --sand2:#DBA84E; --cream:#FFF9EC; --ink:#3a2f5c;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Baloo 2','Comic Sans MS','Segoe UI Rounded',sans-serif;
    background:linear-gradient(180deg,var(--night) 0%,var(--dusk) 38%,var(--sunset) 62%,#E8845C 76%,var(--sand) 92%);
    min-height:100vh;color:var(--ink);overflow-x:hidden;
  }
  .ar{font-family:'Amiri','Noto Naskh Arabic','Traditional Arabic',serif;direction:rtl;}

  /* ================= LANGIT MALAM ================= */
  #stars{position:fixed;inset:0;z-index:0;pointer-events:none;}
  .tw{position:absolute;background:#fff;border-radius:50%;animation:twinkle ease-in-out infinite;}
  @keyframes twinkle{0%,100%{opacity:.15;transform:scale(.7)}50%{opacity:1;transform:scale(1.25)}}
  .shoot{position:fixed;top:8%;left:-8%;width:110px;height:3px;border-radius:3px;z-index:0;
    background:linear-gradient(90deg,rgba(255,255,255,0),#fff);transform:rotate(16deg);
    animation:shoot 1.6s ease-in forwards;pointer-events:none;}
  @keyframes shoot{to{transform:translate(125vw,36vh) rotate(16deg);opacity:0;}}
  .moon{position:fixed;top:26px;left:26px;width:74px;height:74px;border-radius:50%;z-index:0;
    background:transparent;box-shadow:16px 8px 0 0 #FFF4C9;filter:drop-shadow(0 0 18px rgba(255,244,180,.8));
    animation:moonFloat 7s ease-in-out infinite;}
  @keyframes moonFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}

  /* ================= LENTERA ================= */
  .lantern{position:fixed;top:0;z-index:2;transform-origin:top center;animation:swing 4.2s ease-in-out infinite;pointer-events:none;}
  .lantern.l1{left:9%;} .lantern.l2{right:9%;animation-delay:-2.1s;}
  @keyframes swing{0%,100%{transform:rotate(7deg)}50%{transform:rotate(-7deg)}}
  .lantern .rope{width:3px;height:56px;background:var(--gold2);margin:0 auto;}
  .lantern .top{width:22px;height:9px;background:var(--gold2);border-radius:6px 6px 0 0;margin:0 auto;}
  .lantern .body{width:34px;height:46px;margin:0 auto;border-radius:10px 10px 14px 14px;
    background:linear-gradient(180deg,#FFE9A8,var(--gold));border:3px solid var(--gold2);position:relative;
    animation:glowPulse 2.6s ease-in-out infinite;}
  @keyframes glowPulse{0%,100%{box-shadow:0 0 14px 3px rgba(245,197,66,.55)}50%{box-shadow:0 0 26px 8px rgba(245,197,66,.9)}}
  .lantern .body::before{content:"";position:absolute;inset:6px 7px;border:2px solid rgba(217,154,27,.75);border-radius:7px;}
  .lantern .tail{width:10px;height:12px;background:var(--gold2);margin:0 auto;border-radius:0 0 6px 6px;}

  /* ================= PERMADANI ================= */
  .carpet{position:fixed;top:21%;left:-220px;z-index:1;animation:fly 26s linear infinite;pointer-events:none;}
  @keyframes fly{0%{transform:translateX(0) translateY(0)}25%{transform:translateX(32vw) translateY(-22px)}
    50%{transform:translateX(65vw) translateY(8px)}75%{transform:translateX(95vw) translateY(-18px)}
    100%{transform:translateX(130vw) translateY(0)}}
  .carpet .mat{width:110px;height:34px;border-radius:8px;position:relative;
    background:repeating-linear-gradient(90deg,#B23A67 0 14px,#8C2B77 14px 28px);
    border:3px solid var(--gold);animation:ripple 1.6s ease-in-out infinite;}
  @keyframes ripple{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
  .carpet .mat::before,.carpet .mat::after{content:"";position:absolute;top:6px;bottom:6px;width:0;border-left:4px dotted var(--gold);}
  .carpet .mat::before{left:-9px}.carpet .mat::after{right:-9px}
  .carpet .rider{position:absolute;top:-22px;left:38px;font-size:22px;}

  /* ================= HORIZON ================= */
  .horizon{position:fixed;bottom:0;left:0;width:100%;height:190px;z-index:0;pointer-events:none;}
  .mosque{position:absolute;bottom:76px;left:50%;transform:translateX(-50%);width:290px;height:120px;}
  .mq{position:absolute;background:#1E1850;}
  .dome{bottom:34px;left:95px;width:100px;height:56px;border-radius:50% 50% 6px 6px / 100% 100% 6px 6px;}
  .dome::after{content:"";position:absolute;top:-26px;left:46px;width:4px;height:26px;background:#1E1850;}
  .dome::before{content:"🌙";position:absolute;top:-44px;left:38px;font-size:15px;filter:grayscale(1) brightness(3);}
  .hall{bottom:0;left:55px;width:180px;height:40px;border-radius:8px 8px 0 0;}
  .min{bottom:0;width:16px;height:104px;border-radius:6px 6px 0 0;}
  .min::before{content:"";position:absolute;top:-14px;left:-4px;width:24px;height:16px;background:#1E1850;border-radius:50% 50% 4px 4px;}
  .m1{left:22px}.m2{right:22px}
  .win{position:absolute;bottom:8px;width:12px;height:20px;background:var(--gold);border-radius:8px 8px 0 0;animation:winGlow 3s ease-in-out infinite;}
  @keyframes winGlow{0%,100%{opacity:.65}50%{opacity:1}}
  .w1{left:85px}.w2{left:115px;animation-delay:.7s}.w3{left:163px;animation-delay:1.2s}.w4{left:193px;animation-delay:.3s}
  .dune{position:absolute;bottom:-46px;border-radius:50% 50% 0 0;}
  .d1{left:-14%;width:62%;height:120px;background:var(--sand2);}
  .d2{right:-16%;width:68%;height:104px;background:#E7B85F;}
  .d3{left:18%;width:75%;height:78px;background:var(--sand);}
  .palm{position:absolute;bottom:56px;font-size:44px;transform-origin:bottom center;animation:sway 5s ease-in-out infinite;}
  .p1{left:6%}.p2{right:7%;animation-delay:-2.4s;font-size:38px;}
  @keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg)}}
  .camelWalk{position:absolute;bottom:40px;left:-60px;font-size:34px;animation:trek 34s linear infinite;transform:scaleX(-1);}
  @keyframes trek{to{left:110%}}

  /* ================= LAYOUT ================= */
  .wrap{position:relative;z-index:3;max-width:660px;margin:0 auto;padding:16px 14px 210px;}
  header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;animation:dropIn .7s cubic-bezier(.2,1.4,.4,1);}
  @keyframes dropIn{from{transform:translateY(-70px);opacity:0}to{transform:translateY(0);opacity:1}}
  .logo{font-size:clamp(16px,4.2vw,23px);font-weight:800;color:#4a2b00;background:linear-gradient(180deg,#FFE9A8,var(--gold));
    padding:9px 18px;border-radius:16px;border:3px solid var(--gold2);box-shadow:0 5px 0 rgba(0,0,0,.25);}
  .logo::before,.logo::after{content:"✦";color:var(--gold2);margin:0 6px;font-size:13px;}
  .starbank{background:var(--night);border:3px solid var(--gold);border-radius:40px;padding:7px 15px;
    font-size:17px;font-weight:800;color:var(--gold);white-space:nowrap;}
  .iconbtn{background:var(--night);border:3px solid var(--gold);border-radius:50%;width:46px;height:46px;
    font-size:19px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.25);}
  .iconbtn:active{transform:translateY(2px);box-shadow:none;}
  .subtitle{text-align:center;margin:2px 0 14px;font-size:15px;color:#FFF0D0;text-shadow:0 2px 6px rgba(0,0,0,.35);animation:dropIn .8s .1s cubic-bezier(.2,1.4,.4,1) backwards;}

  /* ================= GERBANG ================= */
  .islands{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media (min-width:560px){.islands{grid-template-columns:1fr 1fr 1fr;}}
  .island{border:0;cursor:pointer;text-align:center;color:#fff;font-family:inherit;font-weight:700;
    font-size:14.5px;line-height:1.3;padding:0;background:none;animation:gateIn .6s cubic-bezier(.2,1.5,.4,1) backwards;}
  .islands .island:nth-child(1){animation-delay:.05s}.islands .island:nth-child(2){animation-delay:.1s}
  .islands .island:nth-child(3){animation-delay:.15s}.islands .island:nth-child(4){animation-delay:.2s}
  .islands .island:nth-child(5){animation-delay:.25s}.islands .island:nth-child(6){animation-delay:.3s}
  .islands .island:nth-child(7){animation-delay:.35s}.islands .island:nth-child(8){animation-delay:.4s}
  .islands .island:nth-child(9){animation-delay:.45s}.islands .island:nth-child(10){animation-delay:.5s}
  @keyframes gateIn{from{transform:scale(.4) translateY(50px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
  .gate{border-radius:70px 70px 18px 18px;padding:20px 8px 12px;border:4px solid var(--gold);
    box-shadow:0 6px 0 rgba(0,0,0,.28), inset 0 0 0 3px rgba(255,255,255,.18);position:relative;transition:transform .15s;}
  .island:hover .gate{transform:translateY(-5px);}
  .island:active .gate{transform:scale(.95) translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.28);}
  .gate::before{content:"✦ ✦ ✦";position:absolute;top:7px;left:0;width:100%;font-size:9px;color:rgba(255,255,255,.75);letter-spacing:6px;}
  .island .big{display:block;font-size:34px;margin:5px 0 3px;animation:bob 2.6s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .island small{display:block;font-weight:500;font-size:11px;opacity:.95;margin-top:3px;}
  .island .best{display:inline-block;margin-top:6px;background:rgba(0,0,0,.25);border:2px solid rgba(255,255,255,.4);
    border-radius:20px;padding:2px 10px;font-size:11.5px;}
  .i1 .gate{background:linear-gradient(180deg,#FF8E7A,#E14D4D)} .i2 .gate{background:linear-gradient(180deg,#6FB8E8,#3D74C9)}
  .i3 .gate{background:linear-gradient(180deg,#7ED98A,#3B9E56)} .i4 .gate{background:linear-gradient(180deg,#C0A2FF,#7D55D4)}
  .i5 .gate{background:linear-gradient(180deg,#FFC069,#E8862B)} .i6 .gate{background:linear-gradient(180deg,#54DDD0,#149E96)}
  .i7 .gate{background:linear-gradient(180deg,#FF9BC6,#D6408B)} .i8 .gate{background:linear-gradient(180deg,#C3E56E,#7BA828)}
  .i9 .gate{background:linear-gradient(180deg,#9FA8F5,#4A54C4)} .i10 .gate{background:linear-gradient(180deg,#FFA36C,#E04E2F)}

  /* ================= TOPBAR & KARTU ================= */
  .topbar{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .back{background:var(--night);border:3px solid var(--gold);border-radius:40px;padding:8px 16px;
    font-family:inherit;font-weight:700;font-size:14px;color:var(--gold);cursor:pointer;}
  .back:active{transform:translateY(2px);}
  .progress{flex:1;height:24px;background:rgba(30,24,80,.55);border:3px solid var(--gold);border-radius:20px;position:relative;}
  .progress>div{height:100%;width:0%;background:linear-gradient(90deg,var(--gold),#FFE9A8);border-radius:14px;transition:width .5s cubic-bezier(.3,1.3,.5,1);}
  .progress .camel{position:absolute;top:-16px;left:0;font-size:22px;transform:translateX(-50%) scaleX(-1);transition:left .5s cubic-bezier(.3,1.3,.5,1);}
  .lives{font-size:16px;white-space:nowrap;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4));font-weight:800;color:#fff;}

  .card{background:var(--cream);border:4px solid var(--gold2);border-radius:110px 110px 26px 26px;
    padding:34px 18px 20px;position:relative;
    box-shadow:0 8px 0 rgba(0,0,0,.28), inset 0 0 0 6px #fff, inset 0 0 0 9px rgba(217,154,27,.35);
    animation:cardIn .5s cubic-bezier(.2,1.4,.4,1);}
  @keyframes cardIn{from{transform:scale(.7) rotate(-2deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
  .card::before{content:"۞";position:absolute;top:12px;left:50%;transform:translateX(-50%);font-size:24px;color:var(--gold2);animation:spinSlow 12s linear infinite;}
  @keyframes spinSlow{to{transform:translateX(-50%) rotate(360deg)}}
  .qbox{text-align:center;}
  .prompt{font-size:16px;margin:2px 0 8px;color:#6a5a8f;font-weight:600;}
  .bigArab{font-size:clamp(60px,17vw,100px);line-height:1.5;color:#0e7c66;margin:0 0 6px;
    animation:letterFloat 3s ease-in-out infinite;text-shadow:0 4px 0 rgba(14,124,102,.15);}
  @keyframes letterFloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-8px) scale(1.04)}}
  .midArab{font-size:clamp(34px,9vw,52px);line-height:1.8;color:#0e7c66;margin:2px 0 8px;animation:letterFloat 3.4s ease-in-out infinite;}
  .bigEmoji{font-size:clamp(44px,13vw,74px);line-height:1.25;margin:4px 0 8px;letter-spacing:6px;animation:bob 2.8s ease-in-out infinite;}

  .answers{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:12px;}
  .answers.two{grid-template-columns:1fr 1fr;max-width:360px;margin-left:auto;margin-right:auto;}
  .ans{border:3px solid rgba(0,0,0,.12);border-radius:40px 40px 16px 16px;padding:13px 8px;font-family:inherit;
    font-size:16.5px;font-weight:700;color:#fff;cursor:pointer;min-height:58px;
    box-shadow:0 4px 0 rgba(0,0,0,.22);transition:transform .1s;position:relative;overflow:hidden;}
  .ans::after{content:"";position:absolute;top:0;left:-80%;width:50%;height:100%;transform:skewX(-20deg);
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);animation:shine 3.5s ease-in-out infinite;}
  @keyframes shine{0%,60%{left:-80%}100%{left:130%}}
  .ans:active{transform:translateY(3px);box-shadow:none;}
  .ans.ar{font-size:27px;font-weight:400;}
  .ans.arBig{font-size:38px;font-weight:400;line-height:1.3;}
  .a0{background:#E14D4D}.a1{background:#3D74C9}.a2{background:#3B9E56}.a3{background:#7D55D4}
  .ans.correct{background:#2ea44f !important;animation:pop .45s;}
  .ans.wrong{background:#a49bbf !important;animation:shake .4s;}
  @keyframes pop{40%{transform:scale(1.12) rotate(2deg)}70%{transform:scale(.96)}}
  @keyframes shake{20%{transform:translateX(-7px)}45%{transform:translateX(7px)}70%{transform:translateX(-4px)}}
  .feedback{min-height:30px;margin-top:12px;font-size:17px;font-weight:800;}
  .feedback.good{color:#2e9e4f;animation:pop .4s;} .feedback.bad{color:#d4485c;}

  /* ================= MEMORI ================= */
  .mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:8px;}
  .mcard{aspect-ratio:3/3.6;border:0;border-radius:14px;cursor:pointer;font-family:inherit;position:relative;
    background:linear-gradient(180deg,#4A54C4,#2A2260);border:3px solid var(--gold);color:var(--gold);
    font-size:26px;box-shadow:0 4px 0 rgba(0,0,0,.22);transition:transform .15s;}
  .mcard:active{transform:scale(.93);}
  .mcard .face{display:none;}
  .mcard .backmark{animation:bob 2.4s ease-in-out infinite;display:inline-block;}
  .mcard.open,.mcard.done{background:#fff;animation:flipIn .3s;}
  @keyframes flipIn{from{transform:rotateY(90deg)}to{transform:rotateY(0)}}
  .mcard.open .face,.mcard.done .face{display:flex;align-items:center;justify-content:center;position:absolute;inset:0;font-size:24px;}
  .mcard.open .backmark,.mcard.done .backmark{display:none;}
  .mcard .face .ar{font-size:21px;color:#0e7c66;line-height:1.4;}
  .mcard.done{border-color:#2ea44f;box-shadow:0 0 12px rgba(46,164,79,.6);animation:pop .5s;}

  /* ================= SUSUN KALIMAT ================= */
  .slotline,.chips{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;direction:rtl;}
  .slotline{min-height:60px;background:#fff;border:3px dashed var(--gold2);border-radius:18px;padding:9px;margin-bottom:12px;}
  .chip{border:2px solid rgba(0,0,0,.12);border-radius:30px 30px 12px 12px;padding:9px 15px;
    font-family:'Amiri','Noto Naskh Arabic',serif;font-size:25px;color:#fff;background:#7D55D4;cursor:pointer;
    box-shadow:0 3px 0 rgba(0,0,0,.2);animation:chipIn .4s cubic-bezier(.2,1.5,.4,1) backwards;}
  .chips .chip:nth-child(1){animation-delay:.05s}.chips .chip:nth-child(2){animation-delay:.12s}
  .chips .chip:nth-child(3){animation-delay:.19s}.chips .chip:nth-child(4){animation-delay:.26s}
  @keyframes chipIn{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
  .chip.placed{background:#149E96;}
  .chip:active{transform:translateY(2px) scale(.96);box-shadow:none;}
  .hintline{font-size:14px;color:#6a5a8f;margin-bottom:8px;}
  .checkbtn{margin-top:6px;background:linear-gradient(180deg,#FFE9A8,var(--gold));border:3px solid var(--gold2);
    border-radius:40px;padding:11px 30px;font-family:inherit;font-size:16px;font-weight:800;color:#7a5c00;
    cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.2);}
  .checkbtn:active{transform:translateY(3px);box-shadow:none;}

  /* ================= HASIL ================= */
  .genie{font-size:56px;animation:genieUp 1s cubic-bezier(.2,1.4,.4,1);}
  @keyframes genieUp{from{transform:translateY(60px) scale(.3);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
  .resultStars{font-size:52px;letter-spacing:10px;margin:6px 0;}
  .resultStars span{display:inline-block;animation:starPop .5s cubic-bezier(.2,1.8,.4,1) backwards;}
  .resultStars span:nth-child(1){animation-delay:.2s}.resultStars span:nth-child(2){animation-delay:.45s}.resultStars span:nth-child(3){animation-delay:.7s}
  @keyframes starPop{from{transform:scale(0) rotate(-180deg)}to{transform:scale(1) rotate(0)}}
  .resultMsg{font-size:21px;font-weight:800;margin:4px 0 2px;}
  .resultMsg .ar{font-size:26px;color:#0e7c66;}
  .resultSub{font-size:14px;color:#6a5a8f;margin-bottom:14px;}
  .bigbtn{background:linear-gradient(180deg,#FF8E7A,#E14D4D);border:3px solid #fff;border-radius:40px;color:#fff;
    padding:12px 28px;font-family:inherit;font-size:16.5px;font-weight:800;cursor:pointer;
    box-shadow:0 5px 0 rgba(0,0,0,.25);margin:4px;}
  .bigbtn.alt{background:linear-gradient(180deg,#6FB8E8,#3D74C9);}
  .bigbtn:active{transform:translateY(3px);box-shadow:none;}

  .confetti{position:fixed;top:-30px;font-size:22px;z-index:50;animation:fall linear forwards;pointer-events:none;}
  @keyframes fall{to{transform:translateY(112vh) rotate(560deg);opacity:.5;}}
  .hidden{display:none !important;}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important;}}
</style>
</head>
<body>

<div id="stars"></div>
<div class="moon"></div>
<div class="lantern l1"><div class="rope"></div><div class="top"></div><div class="body"></div><div class="tail"></div></div>
<div class="lantern l2"><div class="rope"></div><div class="top"></div><div class="body"></div><div class="tail"></div></div>
<div class="carpet"><div class="rider">🧒</div><div class="mat"></div></div>

<div class="horizon">
  <div class="mosque">
    <div class="mq min m1"></div><div class="mq min m2"></div>
    <div class="mq hall"></div><div class="mq dome"></div>
    <div class="win w1"></div><div class="win w2"></div><div class="win w3"></div><div class="win w4"></div>
  </div>
  <div class="dune d1"></div><div class="dune d2"></div><div class="dune d3"></div>
  <div class="palm p1">🌴</div><div class="palm p2">🌴</div>
  <div class="camelWalk">🐪</div>
</div>

<div class="wrap">
  <header>
    <div class="logo">🌙 Petualangan Bahasa Arab</div>
    <div style="display:flex;gap:8px;align-items:center;">
      <div class="starbank">⭐ <span id="starCount">0</span></div>
      <button class="iconbtn" id="soundBtn" title="Suara nyala/mati">🔊</button>
    </div>
  </header>

  <!-- ================= MENU ================= -->
  <div id="menu">
    <p class="subtitle">10 gerbang menantimu di Negeri 1001 Malam. Kumpulkan bintang! ✨</p>
    <div class="islands">
      <button class="island i1" data-game="huruf"><div class="gate"><span class="big">🔤</span>Gerbang Huruf<small>Tebak nama huruf hijaiyah</small><span class="best" id="best-huruf">Belum main</span></div></button>
      <button class="island i2" data-game="harakat"><div class="gate"><span class="big">🎵</span>Gerbang Ba-Bi-Bu<small>Baca huruf berharakat</small><span class="best" id="best-harakat">Belum main</span></div></button>
      <button class="island i7" data-game="bunyi"><div class="gate"><span class="big">👂</span>Gerbang Bunyi<small>Dengar bunyi, cari hurufnya</small><span class="best" id="best-bunyi">Belum main</span></div></button>
      <button class="island i8" data-game="kembar"><div class="gate"><span class="big">👯</span>Gerbang Kembar<small>Bedakan huruf yang mirip</small><span class="best" id="best-kembar">Belum main</span></div></button>
      <button class="island i3" data-game="kata"><div class="gate"><span class="big">🧺</span>Gerbang Kata<small>Gambar ↔ kata Arab</small><span class="best" id="best-kata">Belum main</span></div></button>
      <button class="island i4" data-game="angka"><div class="gate"><span class="big">🔢</span>Gerbang Angka<small>Hitung lalu jawab Arab</small><span class="best" id="best-angka">Belum main</span></div></button>

/* --- suara --- */
let actx = null;
function beep(freqs, dur=0.12, type="sine"){
  if(!soundOn) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    freqs.forEach((f,i)=>{
      const o=actx.createOscillator(), g=actx.createGain();
      o.type=type; o.frequency.value=f;
      g.gain.setValueAtTime(.18,actx.currentTime);
      g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+dur);
      o.connect(g); g.connect(actx.destination);
      o.start(actx.currentTime+i*dur); o.stop(actx.currentTime+i*dur+dur);
    });
  }catch(e){}
}

}

/* pembuat soal MC — dipakai mode quiz & kilat */
function makeQuestion(g, cb){
  if(g==="huruf"){
    const [item,...rest] = pick(HURUF, 4);
    cb({promptHTML:`<p class="prompt">Apa nama huruf ini?</p><div class="bigArab ar">${item[0]}</div>`,
        options: shuffle([item[1], ...rest.map(r=>r[1])]), correct:item[1]});
  }
  else if(g==="harakat"){
    const [item,...rest] = pick(HARAKAT, 4);
    cb({promptHTML:`<p class="prompt">Bagaimana cara membacanya?</p><div class="bigArab ar">${item[0]}</div>`,
        options: shuffle([item[1], ...rest.map(r=>r[1])]), correct:item[1]});
  }
  else if(g==="bunyi"){
    const [item,...rest] = pick(HURUF, 4);
    cb({promptHTML:`<p class="prompt">Yang mana huruf yang berbunyi…</p><div class="bigEmoji" style="font-size:40px;">🔊 “${item[1]}”</div>`,
        options: shuffle([item[0], ...rest.map(r=>r[0])]), correct:item[0], arabicBig:true});
  }
  else if(g==="kembar"){
    const k = pick(KEMBAR,1)[0];
    const [huruf, nama, ciri, mirip] = k;
    cb({promptHTML:`<p class="prompt">Huruf kembar! Yang mana huruf <b>${nama}</b>?</p><p class="hintline">Petunjuk: ${ciri}</p>`,
        options: shuffle([huruf, ...pick(mirip,3)]), correct:huruf, arabicBig:true});
  }
  else if(g==="kata"){
    const [item,...rest] = pick(KATA, 4);
    if(Math.random()<0.5){
      cb({promptHTML:`<p class="prompt">Apa bahasa Arabnya?</p><div class="bigEmoji">${item[0]}</div><p class="prompt">(${item[3]})</p>`,
          options: shuffle([item[1], ...rest.map(r=>r[1])]), correct:item[1], arabicButtons:true});
    }else{
      cb({promptHTML:`<p class="prompt">Apa artinya?</p><div class="midArab ar">${item[1]}</div><p class="prompt"><i>${item[2]}</i></p>`,
          options: shuffle([item[3], ...rest.map(r=>r[3])]), correct:item[3]});
    }
  }
  else if(g==="angka"){
    const [item,...rest] = pick(ANGKA, 4);
    const emoji = EMOJI_HITUNG[Math.floor(Math.random()*EMOJI_HITUNG.length)];
    cb({promptHTML:`<p class="prompt">Hitung, lalu pilih angka Arabnya!</p><div class="bigEmoji">${emoji.repeat(item[0])}</div>`,
        options: shuffle([item[1], ...rest.map(r=>r[1])]), correct:item[1], arabicButtons:true});
  }
  else if(g==="cakap"){
    const c = pick(CAKAP,1)[0];
    const [situasi, ucapan, benar, ...salah] = c;
    const isEmoji = ucapan.length<=4 && !/[\u0600-\u06FF]/.test(ucapan);
    cb({promptHTML:`<p class="prompt">${situasi}</p><div class="${isEmoji?'bigEmoji':'midArab ar'}">${ucapan}</div><p class="prompt">Apa jawaban/ucapan yang tepat?</p>`,
        options: shuffle([benar, ...pick(salah,3)]), correct:benar, arabicButtons:true});
  }
  else if(g==="hadza"){
    const [kata, arti, jenis] = pick(HADZA,1)[0];
    const benar = jenis==="M" ? "هٰذَا" : "هٰذِهِ";
    cb({promptHTML:`<p class="prompt">Kata tunjuk mana yang tepat untuk…</p><div class="midArab ar">${kata}</div><p class="prompt">(${arti})</p>`,
        options: ["هٰذَا","هٰذِهِ"], correct:benar, arabicButtons:true, two:true,
        tip: jenis==="F" ? "Ingat: kata berakhiran ة biasanya muannats → هٰذِهِ" : "Tanpa ة biasanya mudzakkar → هٰذَا"});
  }
  else if(g==="kalimat"){ qKalimat(); } // punya alur sendiri
}

function renderMC(q, onAnswer, fastMode=false){
  if(q===undefined) return;
  if(state.game==="kalimat" && state.mode==="quiz") return; // qKalimat merender sendiri
  const card = $("qcard");
  card.style.animation="none"; void card.offsetWidth; card.style.animation="";
  const btnClass = q.arabicBig ? "ar arBig" : (q.arabicButtons ? "ar" : "");
  card.innerHTML = q.promptHTML +
    `<div class="answers ${q.two?'two':''}">` +
    q.options.map((o,i)=>`<button class="ans a${i} ${btnClass}" data-v="${encodeURIComponent(o)}">${o}</button>`).join("") +
    `</div><div class="feedback" id="fb"></div>`;
  card.querySelectorAll(".ans").forEach(btn=>{
    btn.onclick = ()=>{
      if(state.locked) return; state.locked=true;
      const val = decodeURIComponent(btn.dataset.v);
      const ok = val===q.correct;
      if(ok){
        btn.classList.add("correct");
        $("fb").textContent="Hebat! ✔ مُمْتَاز!"; $("fb").className="feedback good";
        state.correct++; dingBenar(); if(!fastMode) confetti();
      }else{
        btn.classList.add("wrong"); if(state.lives!==undefined) state.lives--; dingSalah();
        card.querySelectorAll(".ans").forEach(b=>{ if(decodeURIComponent(b.dataset.v)===q.correct) b.classList.add("correct"); });
        $("fb").textContent = (q.tip? q.tip : "Jawabannya: "+q.correct);
        $("fb").className="feedback bad";
      }
      if(state.mode==="quiz") updateHUD();
      setTimeout(()=>{ state.locked=false; onAnswer(ok); }, fastMode ? (ok?450:950) : (ok?950:1750));
    };
  });
}

/* ================= GERBANG KALIMAT ================= */
function qKalimat(){
  const [words, arti] = pick(KALIMAT,1)[0];
  const scrambled = shuffle([...words]);
  if(scrambled.join("|")===words.join("|")) scrambled.reverse();
  let placed = [];
  const q = $("qcard");
  function render(){
    q.innerHTML = `
      <p class="prompt">Susun kata menjadi kalimat:</p>
      <p class="hintline">Arti: <b>"${arti}"</b> &nbsp;•&nbsp; ketuk kata untuk memindah</p>
      <div class="slotline" id="slots">${placed.map((w,i)=>`<button class="chip placed" data-i="${i}">${w.split("#")[0]}</button>`).join("")||'<span style="color:#c3b78f;font-size:14px;direction:ltr;">— letakkan kata di sini —</span>'}</div>
      <div class="chips" id="pool">${scrambled.map((w,i)=> placed.includes(w+"#"+i)?"":`<button class="chip" data-i="${i}">${w}</button>`).join("")}</div>
      <button class="checkbtn" id="check">✔ Periksa</button>
      <div class="feedback" id="fb"></div>`;
    q.querySelectorAll("#pool .chip").forEach(b=>{
      b.onclick=()=>{ placed.push(scrambled[b.dataset.i]+"#"+b.dataset.i); render(); };
    });
    q.querySelectorAll("#slots .chip").forEach(b=>{
      b.onclick=()=>{ placed.splice(b.dataset.i,1); render(); };
    });
    $("check").onclick=()=>{
      if(state.locked) return;
      const susunan = placed.map(p=>p.split("#")[0]);
      if(susunan.length!==words.length){ $("fb").textContent="Letakkan semua kata dulu ya!"; $("fb").className="feedback bad"; return; }
      state.locked=true;
      const ok = susunan.join("|")===words.join("|");
      if(ok){ $("fb").innerHTML="Hebat! ✔ <span class='ar'>"+words.join(" ")+"</span>"; $("fb").className="feedback good"; state.correct++; dingBenar(); confetti(); }
      else{ state.lives--; $("fb").innerHTML="Belum tepat. Yang benar: <span class='ar'>"+words.join(" ")+"</span>"; $("fb").className="feedback bad"; dingSalah(); }
      updateHUD();
      setTimeout(()=>{ state.qIndex++; nextQuestion(); }, ok?1050:2050);
    };
  }
  render();
}

/* ================= GERBANG MEMORI ================= */
function startMemori(){
  state = {game:"memori", mode:"memori", wrong:0, matched:0, open:[], locked:false};
  show("game");
  setProgress(0);
  $("lives").textContent = "❌ 0";
  const pairs = pick(KATA, 6);
  const cards = shuffle(pairs.flatMap((p,i)=>[
    {id:i, html:`<span style="font-size:30px">${p[0]}</span>`},
    {id:i, html:`<span class="ar">${p[1]}</span>`}
  ]));
  const q = $("qcard");
  q.innerHTML = `<p class="prompt">Buka dua kartu, cocokkan gambar dengan kata Arabnya!</p>
    <div class="mgrid">` +
    cards.map((c,i)=>`<button class="mcard" data-id="${c.id}" data-i="${i}">
        <span class="backmark">۞</span><span class="face">${c.html}</span></button>`).join("") +
    `</div><div class="feedback" id="fb"></div>`;
  q.querySelectorAll(".mcard").forEach(btn=>{
    btn.onclick = ()=>{
      if(state.locked || btn.classList.contains("open") || btn.classList.contains("done")) return;
      btn.classList.add("open"); tick();
      state.open.push(btn);
      if(state.open.length===2){
        state.locked = true;
        const [a,b] = state.open;
        if(a.dataset.id===b.dataset.id){
          setTimeout(()=>{
            a.classList.remove("open"); b.classList.remove("open");
            a.classList.add("done"); b.classList.add("done");
            state.matched++; state.open=[]; state.locked=false;
            setProgress(state.matched/6*100); dingBenar();
            if(state.matched===6){ setTimeout(endMemori, 600); }
          }, 350);
        }else{
          state.wrong++;
          $("lives").textContent = "❌ " + state.wrong;
          setTimeout(()=>{
            a.classList.remove("open"); b.classList.remove("open");
            state.open=[]; state.locked=false; dingSalah();
          }, 750);
        }
      }
    };
  });
}
function endMemori(){
  const w = state.wrong;
  const stars = w<=3?3 : w<=6?2 : w<=10?1 : 1;
  finishRound(stars, `Semua pasangan ketemu! Salah buka: ${w} kali`);
}

/* ================= GERBANG KILAT ================= */
function startKilat(){
  state = {game:"kilat", mode:"kilat", correct:0, jumlah:0, sisa:KILAT_DETIK, locked:false};
  show("game");
  setProgress(100);
  $("lives").textContent = "⏱ " + KILAT_DETIK;
  kilatTimer = setInterval(()=>{
    state.sisa--;
    $("lives").textContent = "⏱ " + state.sisa;
    setProgress(state.sisa/KILAT_DETIK*100);
    if(state.sisa<=5 && state.sisa>0) tick();
    if(state.sisa<=0){ stopTimers(); endKilat(); }
  },1000);
  kilatNext();
}
function kilatNext(){
  if(state.sisa<=0) return;
  const pools = ["huruf","harakat","kata","angka","bunyi"];
  const g = pools[Math.floor(Math.random()*pools.length)];
  makeQuestion(g, q => renderMC(q, ok=>{ state.jumlah++; kilatNext(); }, true));
}
function endKilat(){
  const c = state.correct;
  const stars = c>=12?3 : c>=8?2 : c>=5?1 : 0;
  finishRound(stars, `⚡ ${c} jawaban benar dalam ${KILAT_DETIK} detik!`);
}

/* ================= AKHIR RONDE ================= */
function endQuiz(){
  stopTimers();
  const c = state.correct;
  const stars = c>=7?3 : c>=5?2 : c>=3?1 : 0;
  finishRound(stars, `Benar ${c} dari ${TOTAL_Q} soal`);
}
function finishRound(stars, subText){
  stopTimers();
  totalStars += stars;
  if((best[state.game]||0) < stars) best[state.game]=stars;
  const el = $("best-"+state.game);
  if(el) el.textContent = best[state.game] ? "⭐".repeat(best[state.game]) : "Belum main";
  $("rGenie").textContent = stars>=2 ? "🧞" : "🐪";
  $("rStars").innerHTML = stars? "⭐".repeat(stars).split("").map(s=>`<span>${s}</span>`).join("") : "💪";
  $("rMsg").innerHTML = stars===3?'LUAR BIASA! <span class="ar">مُمْتَاز!</span>' : stars===2?"Hebat! Sedikit lagi sempurna!" : stars===1?"Bagus! Terus berlatih ya!" : "Jangan menyerah, coba lagi!";
  $("rSub").textContent = subText;
  $("starCount").textContent = totalStars;
  if(stars>=2){ confetti(); dingSelesai(); }
  show("result");
}

/* ================= EVENT ================= */
document.querySelectorAll(".island").forEach(b=> b.onclick=()=>startGame(b.dataset.game));
$("backBtn").onclick = ()=>{ stopTimers(); show("menu"); };
$("menuBtn").onclick = ()=>{ stopTimers(); show("menu"); };
$("againBtn").onclick = ()=>startGame(state.game);
$("soundBtn").onclick = ()=>{ soundOn=!soundOn; $("soundBtn").textContent = soundOn?"🔊":"🔇"; };
</script>
